name: Check the "builda-bar" container image

# Builds the image (nothing is pushed) and runs `builda-bar-selftest` inside it, for every Alpine variant on amd64 and for `stable` on arm64
# (QEMU). It runs on pull requests that touch the image, so a broken package list or a pin that moved is found before a release tag.

on:
  pull_request:
    paths:
      - Dockerfile
      - scripts/**
      - .github/workflows/docker-check-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: old-legacy, version: "${{ vars.ALPINE_OLD_LEGACY_VERSION || '3.15.11' }}", platform: linux/amd64}
          - {name: legacy,     version: "${{ vars.ALPINE_LEGACY_VERSION || '3.20.8' }}",     platform: linux/amd64}
          - {name: stable,     version: "${{ vars.ALPINE_STABLE_VERSION || '3.21.5' }}",     platform: linux/amd64}
          - {name: stream,     version: "${{ vars.ALPINE_STREAM_VERSION || '3.22.2' }}",     platform: linux/amd64}
          - {name: stable,     version: "${{ vars.ALPINE_STABLE_VERSION || '3.21.5' }}",     platform: linux/arm64}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        if: matrix.platform == 'linux/arm64'
      - uses: docker/setup-buildx-action@v4
      - name: Build (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: builda-bar:check
          build-args: |
            ALPINE_VERSION=${{ matrix.version }}
            VARIANT_NAME=${{ matrix.name }}
            VCS_REF=${{ github.sha }}
            VERSION=check
      - name: Selftest, as the default user
        run: docker run --rm --platform ${{ matrix.platform }} builda-bar:check builda-bar-selftest
      - name: Selftest, as root (what a CI job that needs Shaker's install or the sandbox runs as)
        run: docker run --rm --platform ${{ matrix.platform }} --user root builda-bar:check builda-bar-selftest
      - name: Distillery and Shaker can be baked in
        if: matrix.platform == 'linux/amd64' && matrix.name == 'stable'
        run: |
          docker build --build-arg ALPINE_VERSION=${{ matrix.version }} --build-arg VARIANT_NAME=${{ matrix.name }} \
            --build-arg DISTILLERY_REF=main --build-arg SHAKER_REF=main -t builda-bar:baked . || {
              echo "::warning::could not clone distillery/shaker (private repositories need --secret id=gh_token); the plain image is checked above"; exit 0; }
          docker run --rm builda-bar:baked sh -c 'python /opt/bytehawks/core/distillery/scripts/autobuilder.py list && shaker version'
